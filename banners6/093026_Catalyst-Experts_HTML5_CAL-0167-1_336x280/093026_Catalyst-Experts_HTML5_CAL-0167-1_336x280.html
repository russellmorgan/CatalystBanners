<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="ad.size"         content="width=336,height=280">
  <meta name="veeva-code"      content="CAL-0167-1">
  <meta name="expiration-date" content="09/30/2027">
  <title> </title>

  <script type="text/javascript">
    var clickTag = "https://www.onclive.com/view/experts-bridge-oncology-and-neurology-to-catch-lems-earlier-in-sclc-with-misty-d-shields-md-phd-triparna-sen-md-phd-ms-and-ditte-primdahl-md";
  </script>

  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }

    #banner {
      position: relative;
      width:  336px;
      height: 280px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #8EBE4E;
    }

    #banner img { display: block; }

    /* frame-1 copy sits on the photo, so Figma gave no flat-fill reference for it —
       these two are exported at full frame size and position themselves. */
    .txt { position: absolute; inset: 0; width: 336px; height: 280px; }

    /* ---- Frame 1 ---- */
    /* the photo is on screen from the first paint — that is also the timeline's
       time-0 state, so the first tick has nothing to change here. It doubles as
       the static fallback if the Enabler or the CDN never arrives. */
    #f1photo { position: absolute; top: 0; left: 0; width: 336px; height: 280px;
               object-fit: cover; object-position: 50% 0; z-index: 10;
               transform-origin: 50% 40%; }
    #f1bar   { position: absolute; left: 0; top: 168px; width: 336px; height: 71px;
               background: #8EBE4E; z-index: 20; }
    #f1head  { z-index: 25; }
    #f1foot  { z-index: 25; }

    /* ---- Frame 2 ---- */
    /* full-frame green block. It starts collapsed to exactly the frame-1 green
       bar (168 -> 239) and scales out on Y to wipe frame 1. Frame 3 keeps this
       same green field, so there is no second background wipe. */
    #f2bg   { position: absolute; left: 0; top: 0; width: 336px; height: 280px;
              background: #8EBE4E; z-index: 30; }
    #f2icon { position: absolute; left: 113px; top: 51px; width: 110px; height: 110px; z-index: 40;
              transform-origin: 50% 50%; }
    #f2head { position: absolute; left: 49.72px; top: 185.69px; width: 238px; z-index: 40; }

    /* ---- Frame 3 ---- */
    #f3head  { position: absolute; left: 44.4px;  top: 31.38px;  width: 247px; z-index: 60; }
    #f3band  { position: absolute; left: 0; top: 163px; width: 336px; height: 58px;
               background: #44264A; z-index: 65; }
    #f3cta   { position: absolute; left: 46px;    top: 178px;    width: 244px; z-index: 70; }
    #f3legal { position: absolute; left: 42.75px; top: 257.95px; width: 252px; z-index: 60; }

    #bg-exit { position: absolute; inset: 0; z-index: 1000; }

    /* CSS owns the frame-1 starting state so nothing flashes before the JS
       timeline runs: fade-in layers start hidden, and the full-frame green
       block starts collapsed onto the frame-1 bar (the timeline only tweens
       away from here). */
    #f1bar, #f1head, #f1foot,
    #f2bg, #f2icon, #f2head,
    #f3head, #f3band, #f3cta, #f3legal { opacity: 0; }

    /* collapsed to y 168..239 — the frame-1 bar. scaleY 71/280 = 0.253571 about
       y = 225.07px (80.38%) maps 0..280 onto exactly 168..239. */
    #f2bg { transform: scaleY(0.253571); transform-origin: 50% 80.38%; }

    #f1photo, #f1bar, #f2bg, #f2icon, #f3band { will-change: transform; }
  </style>
</head>

<body>
  <div id="banner">
    <img id="f1photo" src="img/f1-photo.jpg" alt="">
    <div id="f1bar"></div>
    <img id="f1head" class="txt" src="img/f1-head.png" alt="Cancer-Associated LEMS could be overlooked in your patients with SCLC">
    <img id="f1foot" class="txt" src="img/f1-foot.svg" alt="LEMS=Lambert-Eaton myasthenic syndrome; SCLC=small cell lung cancer.">

    <div id="f2bg"></div>
    <img id="f2icon" src="img/f2-icon.svg" alt="">
    <img id="f2head" src="img/f2-head.png" alt="Be the first to see it">

    <img id="f3head" src="img/f3-head.png" alt="Learn from experts about early recognition and diagnosis">
    <div id="f3band"></div>
    <img id="f3cta" src="img/f3-cta.png" alt="Take a new approach">
    <img id="f3legal" src="img/f3-legal.svg" alt="© 2026 Catalyst Pharmaceuticals, Inc. All Rights Reserved. CAL-0167-1 September 2026">

    <div id="bg-exit" onclick="exitHandler()"></div>
  </div>

<script type="text/javascript">

  // GCM click handler — must use Enabler.exit() per GCM spec; do not use addEventListener
  function exitHandler() {
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { Enabler.exit("clickTag", clickTag); }
    else { window.open(clickTag, '_blank'); }
  }

  // Frame animations — background first, then the type, matching the CAL-0166 "Surface" set.
  // Steps are added to the paused master timeline; nothing renders until play().
  function animationSequence(tl) {
    // CSS owns the initial state (hidden layers + the green block collapsed onto
    // the frame-1 bar via scaleY) and that state IS the timeline at time 0, so the
    // first tick can never contradict what the browser has already painted.
    //
    // Every reveal is set() + to(). from()/fromTo() are deliberately avoided: they
    // default to immediateRender:true, so their "from" values are written to the DOM
    // the moment the timeline is built. The build waits on the Enabler INIT event,
    // which lands ~1s after the banner has painted — so an immediate render there
    // reads as a blink.

    // FRAME 1 — photo is on screen from the start and slowly scales up (1 -> 1.18)
    //           for the whole frame; green bar slides in from the left; then the copy appears
    tl.to('#f1photo', { scale: 1.18, duration: 4.5, ease: 'none' }, 0.2);
    tl.set('#f1bar', { opacity: 1, xPercent: -110 }, 0.5);
    tl.to('#f1bar', { xPercent: 0, duration: 0.55, ease: 'power2.out' }, 0.5);
    tl.to('#f1head', { opacity: 1, duration: 0.35, ease: 'power1.out' }, 1.15);
    tl.to('#f1foot', { opacity: 1, duration: 0.30, ease: 'power1.out' }, 1.45);

    // TRANSITION 1 — the green bar grows out of itself and covers frame 1
    tl.set('#f2bg', { opacity: 1 }, 4.7);
    tl.to('#f2bg',  { scaleY: 1, duration: 0.55, ease: 'power2.inOut' }, 4.7);

    // FRAME 2 — magnifier icon pops in; then the headline fades in
    tl.set('#f2icon', { opacity: 1, scale: 0.4 }, 5.25);
    tl.to('#f2icon', { scale: 1, duration: 0.50, ease: 'back.out(1.6)' }, 5.25);
    tl.to('#f2head', { opacity: 1, duration: 0.35, ease: 'power1.out' }, 5.85);

    // TRANSITION 2 — frame 3 keeps the same green field, so frame 2's contents
    // simply clear (after a 3s hold) rather than being wiped by a second block
    tl.to(['#f2icon', '#f2head'], { opacity: 0, duration: 0.35, ease: 'power1.out' }, '+=3');

    // FRAME 3 — headline + legal fade in; purple bar slides in from the left; then the CTA
    tl.to(['#f3head', '#f3legal'], { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.15');
    tl.set('#f3band', { opacity: 1, x: -336 }, '+=0.05');
    tl.to('#f3band', { x: 0, duration: 0.50, ease: 'power2.out' });
    tl.to('#f3cta', { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.15');

  }

  // Assembled while paused (a paused ancestor also keeps zero-duration steps from
  // rendering during the build), then played.
  var mainTimeline = gsap.timeline({ paused: true });
  function buildTimeline() {
    animationSequence(mainTimeline);
    mainTimeline.play();
    window.mainTimeline = mainTimeline;
  }

  // Wait for GCM Enabler to initialise before starting the animation
  function init() { buildTimeline(); }
  if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { init(); }
  else if (typeof Enabler !== 'undefined') { Enabler.addEventListener(studio.events.StudioEvent.INIT, init); }
  else { setTimeout(init, 100); }
</script>

<!-- review only — remove this tag before GCM handoff -->
<script src="debug-panel.js"></script>
</body>
</html>
