<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="ad.size"         content="width=728,height=90">
  <meta name="veeva-code"      content="CAL-0169-1">
  <meta name="expiration-date" content="09/30/2027">
  <title> </title>

  <script type="text/javascript">
    var clickTag = "https://www.onclive.com/view/experts-bridge-oncology-and-neurology-to-catch-lems-earlier-in-sclc-with-misty-d-shields-md-phd-triparna-sen-md-phd-ms-and-ditte-primdahl-md";
  </script>

  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }

    #banner {
      position: relative;
      width:  728px;
      height: 90px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #101820;
    }

    #banner img { display: block; }

    /* Every art layer is placed at its exact Figma frame offset. Widths are the
       art's natural size; the 2x PNGs are downscaled by the width alone. */

    /* ---- Frame 1 ---- */
    /* photo and green panel are both on screen from the first paint — that is
       also the timeline's time-0 state, so the first tick has nothing to change.
       They double as the static fallback if the Enabler or CDN never arrives.
       Frames 1 and 2 are the same shot at two crops, so the photo scales
       continuously into the frame-2 framing rather than swapping images. */
    #f1photo { position: absolute; top: 0; left: 0; width: 321px; height: 90px;
               z-index: 10; transform-origin: 52.30% 38.81%; }
    #f1green { position: absolute; top: 0; left: 0; width: 728px; height: 90px;
               background: #8EBE4E; z-index: 30; }
    #f1head  { position: absolute; left: 321.35px; top: 33.48px; width: 295px; z-index: 40; }
    #f1foot  { position: absolute; left: 633.63px; top: 73.95px; width: 83px;  z-index: 40; }

    /* ---- Frame 2 ---- */
    #f2head  { position: absolute; left: 305.67px; top: 19.42px; width: 368px; z-index: 40; }
    #f2foot  { position: absolute; left: 587.11px; top: 73.95px; width: 129px; z-index: 40; }

    /* ---- Frame 3 ---- */
    #f3rock  { position: absolute; left: 37px;    top: 16px;     width: 126px; z-index: 50; }
    #f3head  { position: absolute; left: 228.3px; top: 33.49px;  width: 400px; z-index: 50; }

    /* ---- Frame 4 ---- */
    #f4rock  { position: absolute; left: 33px;     top: 11px;    width: 117px; z-index: 50; }
    #f4head  { position: absolute; left: 165px;    top: 28px;    width: 546px; z-index: 50; }
    #f4legal { position: absolute; left: 464.75px; top: 73.95px; width: 252px; z-index: 50; }

    #bg-exit { position: absolute; inset: 0; z-index: 1000; }

    /* CSS owns the frame-1 starting state so nothing flashes before the JS
       timeline runs: fade-in layers start hidden, and the green panel starts
       collapsed to the right edge (the timeline only tweens from here). */
    #f1head, #f1foot,
    #f2head, #f2foot,
    #f3rock, #f3head,
    #f4rock, #f4head, #f4legal { opacity: 0; }

    /* collapsed to x 267..728 — the frame-1 green panel beside the photo.
       scaleX 461/728 = 0.633242 anchored to the right edge. */
    #f1green { transform: scaleX(0.633242); transform-origin: 100% 50%; }

    #f1photo, #f1green, #f3rock, #f4rock { will-change: transform; }
  </style>
</head>

<body>
  <div id="banner">
    <img id="f1photo" src="img/f1-photo.jpg" alt="">
    <div id="f1green"></div>
    <img id="f1head" src="img/f1-head.png" alt="Are your patients with SCLC...">
    <img id="f1foot" src="img/f1-foot.svg" alt="SCLC=small cell lung cancer.">

    <img id="f2head" src="img/f2-head.png" alt="Carrying the burden of Cancer-Associated LEMS with SCLC?">
    <img id="f2foot" src="img/f2-foot.svg" alt="LEMS=Lambert-Eaton myasthenic syndrome.">

    <img id="f3rock" src="img/f3-rock.png" alt="">
    <img id="f3head" src="img/f3-head.png" alt="Earlier recognition can make a difference">

    <img id="f4rock" src="img/f4-rock.png" alt="">
    <img id="f4head" src="img/f4-head.png" alt="Learn more about the symptoms from leaders in the field">
    <img id="f4legal" src="img/f4-legal.svg" alt="© 2026 Catalyst Pharmaceuticals, Inc. All Rights Reserved. CAL-0169-1 September 2026">

    <div id="bg-exit" onclick="exitHandler()"></div>
  </div>

<script type="text/javascript">

  // GCM click handler — must use Enabler.exit() per GCM spec; do not use addEventListener
  function exitHandler() {
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { Enabler.exit("clickTag", clickTag); }
    else { window.open(clickTag, '_blank'); }
  }

  // Four-frame flow — timing/easing carried over from the CAL-0166 "Surface" 728x90.
  // Steps are added to the paused master timeline; nothing renders until play().
  function animationSequence(tl) {
    // CSS owns the initial state (hidden layers + the green panel collapsed beside
    // the photo) and that state IS the timeline at time 0, so the first tick can
    // never contradict what the browser has already painted.
    //
    // Every reveal is set() + to(). from()/fromTo() are deliberately avoided: they
    // default to immediateRender:true, so their "from" values are written to the DOM
    // the moment the timeline is built. The build waits on the Enabler INIT event,
    // which lands ~1s after the banner has painted — so an immediate render there
    // reads as a blink.

    // FRAME 1 — the woman slowly grows on screen; the copy fades in on the panel.
    // The zoom runs continuously through frames 1 and 2, landing on Figma's
    // frame-2 crop, so the two frames share one shot with no visible swap.
    tl.to('#f1photo', { scale: 1.4921, duration: 6.8, ease: 'none' }, 0.2);
    tl.to(['#f1head', '#f1foot'], { opacity: 1, duration: 0.40, ease: 'power1.out' }, 0.4);

    // TRANSITION 1 — the panel widens a touch to its frame-2 width as the copy swaps
    tl.to(['#f1head', '#f1foot'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, 3.6);
    tl.to('#f1green', { scaleX: 0.645604, duration: 0.55, ease: 'power2.inOut' }, 3.6);

    // FRAME 2 — the new copy fades in on the panel
    tl.to(['#f2head', '#f2foot'], { opacity: 1, duration: 0.40, ease: 'power1.out' }, 4.25);

    // TRANSITION 2 — the green panel opens left across the photo to clear the frame;
    // that full-width green becomes the field frames 3 and 4 both sit on
    tl.to(['#f2head', '#f2foot'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, 7.2);
    tl.to('#f1green', { scaleX: 1, duration: 0.55, ease: 'power2.inOut' }, 7.35);

    // FRAME 3 — the rock drops in from the top, then the copy
    tl.set('#f3rock', { opacity: 1, y: -110 }, 7.9);
    tl.to('#f3rock', { y: 0, duration: 0.50, ease: 'back.out(0.8)' }, 7.9);
    tl.to('#f3rock', { y: 5, duration: 0.08, yoyo: true, repeat: 1, ease: 'power2.out' }, 8.32);
    tl.to('#f3head', { opacity: 1, duration: 0.35, ease: 'power1.out' }, 8.45);

    // TRANSITION 3 — frame 3 clears, then the warning-sign rock drops in its place
    tl.to(['#f3rock', '#f3head'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, 11.3);
    tl.set('#f4rock', { opacity: 1, y: -110 }, 11.7);
    tl.to('#f4rock', { y: 0, duration: 0.50, ease: 'back.out(0.8)' }, 11.7);
    tl.to('#f4rock', { y: 5, duration: 0.08, yoyo: true, repeat: 1, ease: 'power2.out' }, 12.12);

    // FRAME 4 — headline, then the legal line
    tl.to('#f4head', { opacity: 1, duration: 0.35, ease: 'power1.out' }, 12.25);
    tl.to('#f4legal', { opacity: 1, duration: 0.35, ease: 'power1.out' }, 12.55);

  }

  // Assembled while paused (a paused ancestor also keeps zero-duration steps from
  // rendering during the build), then played.
  var mainTimeline = gsap.timeline({ paused: true });
  function buildTimeline() {
    animationSequence(mainTimeline);
    mainTimeline.play();
    window.mainTimeline = mainTimeline;
  }

  // Wait for GCM Enabler to initialise before starting the animation
  function init() { buildTimeline(); }
  if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { init(); }
  else if (typeof Enabler !== 'undefined') { Enabler.addEventListener(studio.events.StudioEvent.INIT, init); }
  else { setTimeout(init, 100); }
</script>

<!-- review only — remove this tag before GCM handoff -->
<script src="debug-panel.js"></script>
</body>
</html>
