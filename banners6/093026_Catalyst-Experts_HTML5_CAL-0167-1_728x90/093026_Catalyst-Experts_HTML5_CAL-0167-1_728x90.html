<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="ad.size"         content="width=728,height=90">
  <meta name="veeva-code"      content="CAL-0167-1">
  <meta name="expiration-date" content="09/30/2027">
  <title> </title>

  <script type="text/javascript">
    var clickTag = "https://www.onclive.com/view/experts-bridge-oncology-and-neurology-to-catch-lems-earlier-in-sclc-with-misty-d-shields-md-phd-triparna-sen-md-phd-ms-and-ditte-primdahl-md";
  </script>

  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }

    #banner {
      position: relative;
      width:  728px;
      height: 90px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #8EBE4E;
    }

    #banner img { display: block; }

    /* Every art layer is placed at its exact Figma frame offset. Widths are the
       art's natural size; the 2x PNGs are downscaled by the width alone. */

    /* ---- Frame 1 ---- */
    /* photo and green panel are both on screen from the first paint — that is
       also the timeline's time-0 state, so the first tick has nothing to change.
       They double as the static fallback if the Enabler or CDN never arrives. */
    #f1photo { position: absolute; top: 0; left: 0; width: 321px; height: 90px;
               object-fit: cover; object-position: 50% 50%; z-index: 10; }
    #f1green { position: absolute; top: 0; left: 0; width: 728px; height: 90px;
               background: #8EBE4E; z-index: 20; }
    #f1head  { position: absolute; left: 291.67px; top: 19.42px; width: 401px; z-index: 25; }
    #f1foot  { position: absolute; left: 587.38px; top: 62.95px; width: 130px; z-index: 25; }

    /* ---- Frame 2 ---- */
    /* no block of its own: #f1green expanding to full width IS the frame-2 field,
       and frame 3 keeps that same green, so there is only ever one wipe. */
    #f2icon { position: absolute; left: 180px; top: 13px; width: 65px; height: 65px; z-index: 40;
              transform-origin: 50% 50%; }
    #f2head { position: absolute; left: 267px; top: 28.6px; width: 281px; z-index: 40; }

    /* ---- Frame 3 ---- */
    /* green stays on the left; the purple panel slides in over the right side */
    #f3head  { position: absolute; left: 43.78px;  top: 19.67px; width: 270px; z-index: 60; }
    #f3band  { position: absolute; left: 355px; top: 0; width: 373px; height: 102px;
               background: #44264A; z-index: 65; }
    #f3cta   { position: absolute; left: 427px;    top: 31px;    width: 229px; z-index: 70; }
    #f3legal { position: absolute; left: 464.75px; top: 73.95px; width: 252px; z-index: 70; }

    #bg-exit { position: absolute; inset: 0; z-index: 1000; }

    /* CSS owns the frame-1 starting state so nothing flashes before the JS
       timeline runs: fade-in layers start hidden, and the wide green panel
       starts collapsed to the right edge (the timeline only tweens from here). */
    #f1head, #f1foot,
    #f2icon, #f2head,
    #f3head, #f3band, #f3cta, #f3legal { opacity: 0; }

    /* collapsed to x 258..728 — the frame-1 green panel.
       scaleX 470/728 = 0.645604 anchored to the right edge. */
    #f1green { transform: scaleX(0.645604); transform-origin: 100% 50%; }

    #f1green, #f2icon, #f3band { will-change: transform; }
  </style>
</head>

<body>
  <div id="banner">
    <img id="f1photo" src="img/f1-photo.jpg" alt="">
    <div id="f1green"></div>
    <img id="f1head" src="img/f1-head.png" alt="Cancer-Associated LEMS could be overlooked in your patients with SCLC">
    <img id="f1foot" src="img/f1-foot.svg" alt="LEMS=Lambert-Eaton myasthenic syndrome; SCLC=small cell lung cancer.">

    <img id="f2icon" src="img/f2-icon.svg" alt="">
    <img id="f2head" src="img/f2-head.png" alt="Be the first to see it">

    <img id="f3head" src="img/f3-head.png" alt="Learn from experts about early recognition and diagnosis">
    <div id="f3band"></div>
    <img id="f3cta" src="img/f3-cta.png" alt="Take a new approach">
    <img id="f3legal" src="img/f3-legal.svg" alt="© 2026 Catalyst Pharmaceuticals, Inc. All Rights Reserved. CAL-0167-1 September 2026">

    <div id="bg-exit" onclick="exitHandler()"></div>
  </div>

<script type="text/javascript">

  // GCM click handler — must use Enabler.exit() per GCM spec; do not use addEventListener
  function exitHandler() {
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { Enabler.exit("clickTag", clickTag); }
    else { window.open(clickTag, '_blank'); }
  }

  // Frame animations — timing/easing carried over from the CAL-0166 "Surface" 728x90.
  // Steps are added to the paused master timeline; nothing renders until play().
  function animationSequence(tl) {
    // CSS owns the initial state (hidden layers + the green panel collapsed to the
    // right edge) and that state IS the timeline at time 0, so the first tick can
    // never contradict what the browser has already painted.
    //
    // Every reveal is set() + to(). from()/fromTo() are deliberately avoided: they
    // default to immediateRender:true, so their "from" values are written to the DOM
    // the moment the timeline is built. The build waits on the Enabler INIT event,
    // which lands ~1s after the banner has painted — so an immediate render there
    // reads as a blink.

    // FRAME 1 — photo + green panel already on screen (no entrance); copy fades in;
    //           then the green expands left across the photo to clear the frame
    tl.to(['#f1head', '#f1foot'], { opacity: 1, duration: 0.40, ease: 'power1.out' }, 0.3);
    tl.to('#f1green', { scaleX: 1, duration: 0.55, ease: 'power2.inOut' }, 3.7);
    tl.to(['#f1head', '#f1foot'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, 3.7);

    // FRAME 2 — magnifier icon pops in; then the headline fades in
    tl.set('#f2icon', { opacity: 1, scale: 0.4 }, 4.35);
    tl.to('#f2icon', { scale: 1, duration: 0.50, ease: 'back.out(1.6)' }, 4.35);
    tl.to('#f2head', { opacity: 1, duration: 0.40, ease: 'power1.out' }, 4.95);

    // FRAME 3 — frame 2 clears after a 3s hold; headline fades in; the purple panel
    //           slides in from the right; then the CTA + legal fade in on top of it
    tl.to(['#f2icon', '#f2head'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, '+=3');
    tl.to('#f3head', { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.05');
    tl.set('#f3band', { opacity: 1, x: 373 }, '+=0.10');
    tl.to('#f3band', { x: 0, duration: 0.50, ease: 'power2.out' });
    tl.to(['#f3cta', '#f3legal'], { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.10');

  }

  // Assembled while paused (a paused ancestor also keeps zero-duration steps from
  // rendering during the build), then played.
  var mainTimeline = gsap.timeline({ paused: true });
  function buildTimeline() {
    animationSequence(mainTimeline);
    mainTimeline.play();
    window.mainTimeline = mainTimeline;
  }

  // Wait for GCM Enabler to initialise before starting the animation
  function init() { buildTimeline(); }
  if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { init(); }
  else if (typeof Enabler !== 'undefined') { Enabler.addEventListener(studio.events.StudioEvent.INIT, init); }
  else { setTimeout(init, 100); }
</script>

</body>
</html>
