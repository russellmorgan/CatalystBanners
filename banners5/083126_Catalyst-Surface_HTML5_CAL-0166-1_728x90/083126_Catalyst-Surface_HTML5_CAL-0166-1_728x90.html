<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="ad.size"         content="width=728,height=90">
  <meta name="veeva-code"      content="CAL-0166-1">
  <meta name="expiration-date" content="08/31/2027">
  <title> </title>

  <script type="text/javascript">
    var clickTag = "https://cancerassociatedlems.com/test/";
  </script>

  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }

    #banner {
      position: relative;
      width:  728px;
      height: 90px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000000;
    }

    #banner img { display: block; }

    /* full-frame text layers — the SVG/PNG art positions each block itself */
    .txt { position: absolute; inset: 0; width: 728px; height: 90px; }

    /* ---- Frame 1 ---- */
    #f1photo { position: absolute; top: 0; left: 0;   width: 321px; height: 90px; z-index: 10; }
    #f1green { position: absolute; top: 0; left: 0;   width: 728px; height: 90px; background: #8EBE4E; z-index: 20; }
    #f1head  { z-index: 25; }
    #f1foot  { z-index: 25; }

    /* ---- Frame 2 ---- */
    #f2rock   { position: absolute; top: 13px; left: 72px; width: 111px; z-index: 50; }
    #f2purple { position: absolute; top: 0; left: 260px; width: 468px; height: 90px; background: #44264A; z-index: 40; }
    #f2head   { z-index: 55; }

    /* ---- Frame 3 ---- */
    #f3purple { position: absolute; top: 0; left: 0;   width: 728px; height: 90px; background: #44264A; z-index: 60; }
    #f3head   { z-index: 70; }
    #f3green  { position: absolute; top: 0; left: 319px; width: 409px; height: 90px; background: #8EBE4E; z-index: 75; }
    #f3cta    { z-index: 80; }
    #f3foot   { z-index: 80; }
    #f3rock   { position: absolute; top: 16px; left: 322px; width: 128px; z-index: 90; }

    #bg-exit { position: absolute; inset: 0; z-index: 1000; }

    /* start hidden in CSS so the (highest z-index) end-card layers don't flash
       before GSAP loads and runs its opening gsap.set() */
    #f1head, #f1foot,
    #f2rock, #f2purple, #f2head,
    #f3purple, #f3head, #f3green, #f3rock, #f3cta, #f3foot { opacity: 0; }

    #f1green, #f2rock, #f2purple, #f3purple, #f3green { will-change: transform; }
  </style>
</head>

<body>
  <div id="banner">
    <img id="f1photo" src="img/f1-photo.jpg" alt="">
    <div id="f1green"></div>
    <img id="f1head" class="txt" src="img/f1-head.png" alt="Is Cancer-Associated LEMS weighing down your patients with SCLC?">
    <img id="f1foot" class="txt" src="img/f1-foot.svg" alt="LEMS=Lambert-Eaton myasthenic syndrome; SCLC=small cell lung cancer.">

    <img id="f2rock" src="img/f2-rock.png" alt="">
    <div id="f2purple"></div>
    <img id="f2head" class="txt" src="img/f2-head.png" alt="Lighten their burden through earlier recognition">

    <div id="f3purple"></div>
    <img id="f3head" class="txt" src="img/f3-head.png" alt="Look beyond the surface">
    <div id="f3green"></div>
    <img id="f3cta" class="txt" src="img/f3-cta.png" alt="Uncover more at Booth 219">
    <img id="f3foot" class="txt" src="img/f3-foot.svg" alt="© 2026 Catalyst Pharmaceuticals, Inc. All Rights Reserved. CAL-0166-1 August 2026">
    <img id="f3rock" src="img/f3-rock.png" alt="">

    <div id="bg-exit" onclick="exitHandler()"></div>
  </div>

<script type="text/javascript">

  // GCM click handler — must use Enabler.exit() per GCM spec; do not use addEventListener
  function exitHandler() {
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { Enabler.exit("clickTag", clickTag); }
    else { window.open(clickTag, '_blank'); }
  }

  function animationSequence() {
    // hidden until their step; reveals use set()+to() (no immediateRender:false, no "+=" tween values)
    gsap.set(['#f1head', '#f1foot',
              '#f2rock', '#f2purple', '#f2head',
              '#f3purple', '#f3head', '#f3green', '#f3rock', '#f3cta', '#f3foot'], { opacity: 0 });
    // panels that start life collapsed to one side and open across the width
    gsap.set('#f1green',  { scaleX: 0.6456, transformOrigin: '100% 50%' });  // visible from t=0 — green panel on the right
    gsap.set('#f3purple', { scaleX: 0.6456, transformOrigin: '100% 50%' });

    const tl = gsap.timeline();

    // FRAME 1 — woman + green bar already on screen (no entrance); copy fades in; then green expands left
    tl.to(['#f1head', '#f1foot'], { opacity: 1, duration: 0.40, ease: 'power1.out' }, 0.3);
    tl.to('#f1green', { scaleX: 1, duration: 0.55, ease: 'power2.inOut' }, 3.7);
    tl.to(['#f1head', '#f1foot'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, 3.7);

    // FRAME 2 — rock drops from top; purple slides in from the right; then the white text fades in
    tl.set('#f2rock', { opacity: 1, y: -110 }, 4.35);
    tl.to('#f2rock', { y: 0, duration: 0.50, ease: 'back.out(0.8)' }, 4.35);
    tl.to('#f2rock', { y: 6, duration: 0.08, yoyo: true, repeat: 1, ease: 'power2.out' }, 4.77);
    tl.set('#f2purple', { opacity: 1, x: 468 }, 4.95);
    tl.to('#f2purple', { x: 0, duration: 0.50, ease: 'power2.out' }, 4.95);
    tl.to('#f2head', { opacity: 1, duration: 0.40, ease: 'power1.out' }, 5.55);

    // FRAME 3 — purple expands first; headline fades in; green bar slides in from the right;
    //           once it lands the rock fades in, then the CTA + legal fade in together
    tl.set('#f3purple', { opacity: 1 }, '+=3');
    tl.to('#f3purple', { scaleX: 1, duration: 0.55, ease: 'power2.inOut' });
    tl.to(['#f2head', '#f2rock'], { opacity: 0, duration: 0.30, ease: 'power1.out' }, '<');
    tl.to('#f3head', { opacity: 1, duration: 0.35, ease: 'power1.out' });
    tl.set('#f3green', { opacity: 1, x: 409 }, '+=0.10');
    tl.to('#f3green', { x: 0, duration: 0.50, ease: 'power2.out' });
    tl.to('#f3rock', { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.05');
    tl.to(['#f3cta', '#f3foot'], { opacity: 1, duration: 0.35, ease: 'power1.out' }, '+=0.10');

    return tl;
  }

  var mainTimeline = gsap.timeline({ paused: true });
  function buildTimeline() {
    mainTimeline.add(animationSequence());
    mainTimeline.play();
    window.mainTimeline = mainTimeline;
  }

  // Wait for GCM Enabler to initialise before starting the animation
  function init() { buildTimeline(); }
  if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { init(); }
  else if (typeof Enabler !== 'undefined') { Enabler.addEventListener(studio.events.StudioEvent.INIT, init); }
  else { setTimeout(init, 100); }
</script>

<!-- review only — remove this tag before GCM handoff -->
<script src="debug-panel.js"></script>
</body>
</html>
