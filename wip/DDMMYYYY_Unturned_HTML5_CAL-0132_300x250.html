<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="ad.size"         content="width=300,height=250">
  <meta name="veeva-code"      content="CAL-0135">
  <meta name="expiration-date" content="01/01/2028">
  <title> </title>

  <script type="text/javascript">
    var clickTag  = "https://cancerassociatedlems.com/test/";
  </script>

  <script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --green:#8EBE4E;
      --purple:#44264A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { 
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }

    #banner {
      position: relative;
      width:  300px;
      height: 250px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: var(--green);
    }
    .frame {
      position: absolute;
      top: 0; left: 0;
      width: 300px; height: 250px;
      overflow: hidden;
      z-index: 10;
      opacity:0;
    }
    .frame.flex {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
    }
    .frame img {
      display: block;
      border: 0px solid red; /* debug img sizes when needed */
    }
    .bar {
      display:flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      background:var(--green);
      width: 100%;
      padding: 12px 0px 12px 0px;
      transform: translate3d(-300px, 0px, 0);
    }
    .bar img {
      opacity:0;
    }
    #frame1 {
      opacity: 1;
    }
    #woman {
      position: absolute;
      transform-origin: center;
      transform: scale(0.577) translate3d(-670px,-435px,0);
      opacity:1;
      z-index:5;
    }
    #frame3 {
      z-index:30;
      background: var(--green);
    }
    #frame4 {
      z-index:40;
      background: var(--purple);
    }
  </style>
</head>

<body>
  <div id="banner">
    <!-- woman background image -->
    <img src="img/unturned/stone_woman.jpg" alt="rock" id="woman">

    <div class="frame flex" id="frame1" style="justify-content: flex-end;padding-bottom:3px">
        <img src="img/unturned/300x250_unturned_frame1_txt1.svg" id="f1-headline" style="opacity: 0;">
        <img src="img/unturned/300x250_unturned_legal1.svg" id="f1-legal" style="opacity: 0;">
    </div>

    <div id="frame2" class="frame flex" style="justify-content: flex-end">
      <div class="bar"style="position:relative;top:-20px">
        <img src="img/unturned/300x250_unturned_frame2_txt1.svg" alt="">
      </div>
      <img src="img/unturned/300x250_unturned_legal2.svg" id="legal2" style="transform:translateY(-5px);opacity:0">
    </div>

    <div class="frame" id="frame3">
      <img src="img/unturned/300x250_unturned_frame3_txt1.svg" id="frame3txt" style="margin:auto;opacity:0; transform:translateY(40px)">
      <div style="position: absolute; bottom: 5px; width: 100%; text-align: center; opacity:0" id="legal3">
        <img src="img/unturned/300x250_unturned_legal3.svg" style="display: inline-block;"></div>
    </div>

    <div id="frame4" class="frame flex">
      <img src="img/unturned/300x250_unturned_frame4_txt1.svg" style="opacity: 0; transform:translateY(10px)">
      <div class="bar endframe">
        <img src="img/unturned/boulder.png">
        <img src="img/unturned/300x250_unturned_frame4_txt2.svg" style="transform: translateX(-5px);">
      </div>
      <img src="img/unturned/300x250_unturned_legal4.svg" id="legal4" style="opacity:0">
    </div>

    <div id="bg-exit" onclick="exitHandler()"></div>
  </div>
<script type="text/javascript">

    // GCM click handlers — must use Enabler.exit() per GCM spec; do not use addEventListener
    function exitHandler()  { if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { Enabler.exit("clickTag",  clickTag); } else { window.open(clickTag, '_blank'); } }

    function animationSequence() {
      const tl = gsap.timeline({
        delay:0.5,
        defaults: {ease:"power1.out",duration:0.2}
    });
      //frame 1
      tl.to("#f1-headline",{opacity:1,duration:0.5});
      tl.to("#f1-legal",{opacity:1});

      //frame 2
      tl.to("#frame1",{opacity:0},"+=4");
      tl.to("#frame2",{opacity:1});
      tl.to("#frame2 .bar",{x:0,duration:0.5,ease: "power4.out"});
      tl.to("#frame2 .bar img",{opacity:1},"+=0.2");
      tl.to("#legal2",{opacity:1});
      tl.to("#frame2 .bar img",{opacity:0},"+=2");
      tl.to("#legal2",{opacity:0});
      tl.to("#frame2 .bar",{scale:6,duration:0.8,ease: "power4.out"});
      

      //frame 3
      tl.to("#frame3",{opacity:1});
      tl.set("#frame2 .bar",{scale:1});
      tl.fromTo("#frame3txt",{autoAlpha:0,scale:0.4},{autoAlpha:1,scale:1,duration:0.8,ease:"back.inOut(1.5)"});
      tl.to("#legal3",{opacity:1});
      tl.to("#frame3txt",{autoAlpha:0,scale:0.8,duration:0.5,ease:"power2.in"},"+=2");
      tl.to("#legal3",{opacity:0},"<");

      //frame 4
      tl.to("#frame4",{opacity:1},"+=0.4");
      tl.to("#frame4 img:first-child",{opacity:1,duration:0.5});
      tl.to("#frame4 .bar",{x:0,duration:0.5,ease:"power4.inOut"});
      tl.to("#frame4 .bar img",{opacity:1},"+=0.2");
      tl.to("#legal4",{opacity:1},"+=0.2");
      return tl;  
    }

    function womanSequence() {
      const tl = gsap.timeline({delay:1});
      tl.to("#woman",{scale:1.02,y:"+=40",x:"-=25",duration:2,ease: "power1.inOut"});
      return tl;
    }

    var mainTimeline = gsap.timeline({ paused: true });

    // Build master timeline
    function buildTimeline() {
      mainTimeline.add(animationSequence()).add(womanSequence(),"<");
      mainTimeline.play();
    }


    // Wait for GCM Enabler to initialise before starting the animation
    function init() { buildTimeline(); }
    if (typeof Enabler !== 'undefined' && Enabler.isInitialized()) { init(); }
    else if (typeof Enabler !== 'undefined') { Enabler.addEventListener(studio.events.StudioEvent.INIT, init); }
    else { setTimeout(init, 100); }
  </script>

  <script src="debug-panel.js"></script>
</body>
</html>
